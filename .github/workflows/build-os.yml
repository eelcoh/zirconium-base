name: Build and Push Custom Zirconium OS

on:
  push:
    branches:
      - main
    paths:
      - 'Containerfile'
      - '.github/workflows/**'
  schedule:
    # Bouwt automatisch elke zondag om 00:00 uur voor de nieuwste (beveiligings)updates
    - cron: '0 0 * * 0'
  workflow_dispatch: # Hiermee kun je de build ook handmatig starten via de GitHub website

env:
  REGISTRY: ghcr.io
  # Slaat de image op onder de naam van je repository (alles in kleine letters)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (optioneel, voor multi-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in bij GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Genereer metadata (tags en labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Bouw en push de OS Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: latest ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Optimalisatie voor snellere opeenvolgende builds via GitHub cache
          cache-from: type=gha
          cache-to: type=gha,mode=max
